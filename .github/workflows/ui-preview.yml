name: UI preview

on:
  pull_request:
    paths:
      - 'internal/cli/**'
      - 'assets/**'
      - 'Makefile'
      - '.github/workflows/ui-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache: true
      - name: Install screenshot renderer
        run: go install github.com/charmbracelet/freeze@v0.2.2
      - name: Render terminal previews
        run: |
          mkdir -p build/frames build/screenshots
          MOX_SCREENSHOT_DIR="$PWD/build/frames" go test ./internal/cli -run TestGenerateScreenshots -count=1
          for frame in build/frames/*.ans; do
            name=$(basename "$frame" .ans)
            "$(go env GOPATH)/bin/freeze" -l ansi --window --padding 25 --margin 15 --border.radius 10 --font.family "DejaVu Sans Mono" -o "build/screenshots/$name.png" < "$frame"
          done
          for name in hub editor add; do
            "$(go env GOPATH)/bin/freeze" -l ansi --theme github --background '#ffffff' --window --padding 25 --margin 15 --border.radius 10 --font.family "DejaVu Sans Mono" -o "build/screenshots/$name-light.png" < "build/frames/$name.ans"
          done
      - name: Export preview frames for inspection
        if: always()
        run: |
          for file in build/frames/*.ans build/screenshots/*.png; do
            [ -f "$file" ] || continue
            echo "MOX_FILE_BEGIN $file"
            base64 -w80 "$file"
            echo MOX_FILE_END
          done
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: mox-ui-preview
          path: |
            build/frames
            build/screenshots
          retention-days: 7
