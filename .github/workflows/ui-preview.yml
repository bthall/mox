name: UI preview

on:
  pull_request:
    paths:
      - 'internal/cli/**'
      - 'assets/**'
      - 'Makefile'
      - '.github/workflows/ui-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache: true
      - name: Install screenshot renderer
        run: go install github.com/charmbracelet/freeze@v0.2.2
      - name: Render terminal previews
        run: |
          mkdir -p build/frames build/screenshots
          MOX_SCREENSHOT_DIR="$PWD/build/frames" go test ./internal/cli -run TestGenerateScreenshots -count=1
          for frame in build/frames/*.ans; do
            name=$(basename "$frame" .ans)
            "$(go env GOPATH)/bin/freeze" "$frame" -l ansi --window --padding 25 --margin 15 --border.radius 10 --font.family "DejaVu Sans Mono" -o "build/screenshots/$name.png"
          done
      - name: Bundle development dependencies
        run: |
          go mod download
          mkdir -p build/tools
          cp "$(go env GOPATH)/bin/freeze" build/tools/
          tar -czf build/ui-dev-bundle.tgz -C "$(go env GOMODCACHE)" .
      - uses: actions/upload-artifact@v6
        with:
          name: mox-ui-preview
          path: |
            build/frames
            build/screenshots
            build/tools
            build/ui-dev-bundle.tgz
          retention-days: 7
